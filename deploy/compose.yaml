name: fieldlog

services:
  timeseries:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fieldlog
      POSTGRES_USER: fieldlog
      POSTGRES_PASSWORD: ${FIELDLOG_DB_PASSWORD:?set FIELDLOG_DB_PASSWORD in deploy/.env}
    ports:
      - "5544:5432"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - timeseries-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldlog -d fieldlog"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  timeseries-data:
